name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # adds the manual "Run workflow" button in the Actions tab
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install CDK CLI
        run: make install-cdk

      - name: Sync dependencies
        run: make sync

      - name: Lint
        run: make lint

      - name: Run unit tests
        run: make test

      - name: CDK synth
        run: make synth